name: dq-self-service-portal
description: Data Quality Self-Service Portal for managing Lakehouse Monitoring
version: 1.0.0

resources:
  apps:
    dq_portal:
      name: dq-self-service-portal
      description: Self-service portal for data quality stewards
      
      # App source
      source_code_path: .
      
      # Resources
      resources:
        - name: sql_warehouse
          description: SQL Warehouse for metadata queries
          
env:
  - name: CATALOG
    default: "dbdemos_steventan"
  - name: ADMIN_SCHEMA
    default: "monitoring_admin"
  - name: DATA_SCHEMA
    default: "lakehouse_monitoring"
  - name: OUT_SCHEMA
    default: "lakehouse_monitoring_demo_results"

