resources:
  apps:
    dq_portal:
      name: dq-self-service-portal
      description: Data Quality Self-Service Portal for managing Lakehouse Monitoring
      
      # Source code
      source_code_path: .
      
      # App configuration
      config:
        command:
          - "python"
          - "app.py"
        
        env:
          # Application-specific configuration (required)
          - name: CATALOG
            value: "dbdemos_steventan"
          - name: ADMIN_SCHEMA
            value: "monitoring_admin"
          - name: DATA_SCHEMA
            value: "lakehouse_monitoring"
          - name: OUT_SCHEMA
            value: "lakehouse_monitoring_demo_results"
          - name: SQL_WAREHOUSE_ID
            value: "862f1d757f0424f7"
          - name: DATABRICKS_ORG_ID
            value: "1444828305810485"
          - name: DASHBOARD_ID
            value: "01f097746d9d1bbbbc0d7939c55bb781"
          
          # Note: The following are automatically provided by Databricks Apps:
          # - DATABRICKS_HOST: Workspace URL
          # - DATABRICKS_CLIENT_ID: Service principal client ID
          # - DATABRICKS_CLIENT_SECRET: OAuth secret
          # Reference: https://docs.databricks.com/dev-tools/databricks-apps/system-env
      
      # Resources
      resources:
        - name: shared_warehouse
          description: SQL Warehouse for metadata queries
          permission: CAN_USE
          sql_warehouse:
            id: "${var.warehouse_id}"
